openapi: 3.1.0

info:
  title: orders-service — REST API
  version: 1.6.0
  description: >-
    Корзина, оформление и жизненный цикл заказа: расчёт суммы с учётом акций,
    выбор способа получения, оценка времени готовности (ETA), поиск заказа и
    отметка выдачи и отмена персоналом. Хранилище — orders-db. (UC-ORD-*, UC-RCV-*)
    Контракт нарезан из единой спецификации ДЗ-1; общие компоненты — `_common.yaml`.


    **Статус реализации** (`x-status` на операциях): `implemented` — есть в коде
    `services/orders`; `planned` — целевое поведение, появится в указанном этапе. С S6 все
    операции контракта реализованы.


    **Жизненный цикл (ADR-10).** Заказ создаётся *до* оплаты: онлайн-оплата →
    `pending_payment` (`paymentStatus=pending`), оплата курьеру/на кассе →
    сразу `accepted` (предоплаты нет). В `orders.state` заказ публикуется с
    `revision=1`; после подтверждения оплаты (S3) — повторно, `paymentStatus=paid`,
    `revision+1`. Неоплаченный заказ не уходит в производство.


    **Доступ.** Корзина и заказ принадлежат пользователю (`userId`) либо гостю.
    Гость владеет ресурсом, пока знает его UUID (`cartId`/`orderId` — ссылочный токен,
    UUIDv4); ресурс пользователя виден только ему — чужой запрос получает `404`
    (существование не раскрывается).


    **Персонал (S6).** Операции персонала (`staff_fax`-заказ, `searchOrder`, `markOrderIssued`,
    `cancelOrder`) доступны ролям `STAFF`, `FRANCHISE_OWNER` (только заказы ресторанов из
    claim `restaurants[]` токена) и `HQ_STAFF` (любой ресторан). Гость — `401 UNAUTHORIZED`,
    `CUSTOMER` — `403 FORBIDDEN`, сотрудник другого ресторана видит чужой заказ как `404
    ORDER_NOT_FOUND` (существование не раскрывается). Заказ, созданный сотрудником по факсу,
    принадлежит клиенту-гостю: по знанию UUID его видит и клиент (`getOrder`), а `createdBy`
    фиксирует сотрудника в журнале статусов.


    **Выдача и неполучение (S6).** `markOrderIssued` проводит `ready → handed_over → closed` одной
    транзакцией (в `orders.status` оба шага) и только для самовывоза и оплаченного заказа
    (`paymentStatus=paid`; оплата `pos` принимается на кассе до выдачи — `initiatePosPayment`).
    Повторная выдача уже закрытого выданного заказа — `200` без эффекта. Заказ самовывоза, который
    не забрали за `NOT_RECEIVED_AFTER` (по умолчанию 2 ч) после `ready`, автоматически переходит
    в `not_received` (`reason=pickup_timeout`); дальнейшая судьба такого заказа (списание, возврат)
    — правило ресторана вне платформы.


    **Отмена и возврат (S6).** Сотрудник может отменить заказ в `pending_payment` и `accepted`
    (до начала приготовления): `cancelled` публикуется в `orders.status`, payment-service
    возвращает деньги по оплаченному заказу (или отменяет неоплаченную операцию у шлюза) и
    публикует `refundStatus` в `orders.payments.status`; orders отражает его в `Order.refundStatus`.
    `paid`, пришедший по уже отменённому заказу, также ведёт к возврату.


    **Оплата (S3).** orders потребляет `orders.payments.status`: `paid` переводит
    `pending_payment → accepted` и публикует `orders.state` повторно (`paymentStatus=paid`,
    `revision+1`); `declined`/`unknown` отражаются в `paymentStatus`, заказ остаётся
    `pending_payment` (можно оплатить заново). Заказ с `paymentStatus=unknown` не
    отменяется по таймауту неоплаты сразу — ждёт итога от payment (отдельный, более
    длинный срок). `paid` для уже отменённого заказа не возвращает его в работу:
    `paymentStatus=paid` при `status=cancelled` означает «деньги получены, нужен возврат» (S6).


    **Производство (S4).** orders потребляет `orders.dish.status` и `production.lead.time`.
    Статус заказа выводится из статусов блюд: все блюда `queued` — заказ остаётся
    `accepted`; хотя бы одно блюдо `cooking` (или `ready`) — `cooking`; все блюда
    `ready` — `ready`. Статусы приходят снимком всех блюд заказа и применяются по
    `updatedAt` (устаревшее событие игнорируется); статус не откатывается назад.
    Событие по неоплаченному (`pending_payment`) или отменённому заказу игнорируется.
    Каждый переход публикуется в `orders.status`, для `accepted`/`cooking` — с `etaReadyAt`.


    **Доставка (S7).** Для заказа с доставкой orders потребляет `orders.delivery.status`
    (delivery-service). Снимок статуса доставки хранится у заказа (`Order.delivery`) и применяется
    по `updatedAt` (устаревшее событие игнорируется). Курьер ищется параллельно с приготовлением,
    поэтому доставка может ждать готовности заказа: `picked_up`/`en_route` переводит
    `ready → on_delivery` (если заказ ещё не `ready`, переход выполняется в момент готовности,
    в той же транзакции); `delivered` — `on_delivery → delivered`; после `delivered` заказ
    закрывается (`delivered → closed`), как только `paymentStatus=paid` (при онлайн-оплате — сразу,
    при оплате курьеру — когда payment подтвердит деньги). `failed/undelivered` у `on_delivery`
    заказа — `not_received` (`statusReason=undelivered`). `failed/no_courier` заказ **не
    отменяет и не двигает**: он остаётся `ready`, клиенту предлагается самовывоз, а сотрудник
    выдаёт заказ в ресторане операцией `markOrderIssued` (E2 UC-ORD-06). Такой заказ, как и
    не забранный самовывоз, не получаемый за `NOT_RECEIVED_AFTER`, переходит в `not_received`
    (`pickup_timeout`). Событие по заказу вне `ready`/`on_delivery`/`delivered` (кроме
    запоминания снимка) ничего не меняет.


    **Адрес и зона доставки (S7, долг №10).** Доставка требует координат адреса
    (`address.location`, клиент получает их от карты на своей стороне): без них —
    `422 ADDRESS_LOCATION_REQUIRED`. Расстояние от ресторана до адреса считается по
    данным `getRestaurant` (`location`, `deliveryRadiusMeters`) и не должно превышать радиус
    доставки: иначе `422 ADDRESS_OUT_OF_ZONE` с расширением `distanceMeters`, `radiusMeters` и
    `hint=pickup`. Проверка выполняется при `setCartFulfillment` (раннее сообщение клиенту) и
    повторно при `createOrder` (ресторан мог изменить радиус); недоступность restaurant-service
    — `503 RESTAURANT_UNAVAILABLE` (fail-closed).


    **Деньги** — целые копейки (ADR-13); скидки пока `0` (расчёт — S8, интерфейс
    `Discounter` заложен, реализация-заглушка).


    **Сопоставление с событиями.** `paymentMethod`: `online_card→online`,
    `courier_card→courier`, `pos→restaurant`; `channel`: `online→online`,
    `staff_fax→fax`. Допустимые способы оплаты: самовывоз — `online_card|pos`,
    доставка — `online_card|courier_card`.


    **Коды ошибок (`Problem.code`):** `INVALID_PARAMETER`, `INVALID_JSON`,
    `IDEMPOTENCY_KEY_REQUIRED|INVALID|REUSED|IN_PROGRESS`, `RESTAURANT_NOT_FOUND`,
    `CART_NOT_FOUND`, `CART_EMPTY`, `CART_CLOSED`, `CART_CHANGED`, `ITEMS_UNAVAILABLE`,
    `PRICE_CHANGED`, `RESTAURANT_CLOSED`, `DELIVERY_NOT_AVAILABLE`, `ADDRESS_REQUIRED`,
    `ADDRESS_LOCATION_REQUIRED`, `ADDRESS_OUT_OF_ZONE`,
    `FULFILLMENT_REQUIRED`, `CONTACT_REQUIRED`, `PAYMENT_METHOD_NOT_ALLOWED`,
    `ORDER_NOT_FOUND`, `ORDER_STATE_CONFLICT`, `INVALID_SLOT`, `MENU_UNAVAILABLE`,
    `RESTAURANT_UNAVAILABLE`, `UNAUTHORIZED`, `FORBIDDEN`, `ORDER_NOT_PAID`,
    `NOT_PICKUP_ORDER`, `INVALID_ORDER_NUMBER`. (`CHANNEL_NOT_AVAILABLE` с S6 не используется.)

servers:
  - url: https://api.blt.example/v1
    description: Единая точка входа (api-gateway)
  - url: http://localhost:8084
    description: Локальный запуск (`go run` / docker compose)

security:
  - bearerAuth: []
  - {}

tags:
  - name: orders-service

paths:

  /carts:
    post:
      tags: [orders-service]
      operationId: createCart
      x-status: implemented
      summary: Начать заказ / создать корзину
      description: >-
        Создаёт корзину в контексте выбранного ресторана (ресторан проверяется в
        restaurant-service). Поддерживается гостевое оформление (без авторизации,
        `guest=true`) с контактными данными. Неавторизованный запрос без `guest=true`
        — `401`. (UC-ORD-01/03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartCreateRequest' }
      responses:
        '201':
          description: Корзина создана
          headers:
            Location: { $ref: '_common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '404':
          description: Ресторан не найден или не активен (`RESTAURANT_NOT_FOUND`)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '503':
          description: restaurant-service недоступен (`RESTAURANT_UNAVAILABLE`)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }

  /carts/{cartId}:
    get:
      tags: [orders-service]
      operationId: getCart
      x-status: implemented
      summary: Состав и сумма корзины
      parameters:
        - { $ref: '#/components/parameters/CartId' }
      responses:
        '200':
          description: Текущий состав и предварительная сумма
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /carts/{cartId}/items:
    put:
      tags: [orders-service]
      operationId: updateCartItems
      x-status: implemented
      summary: Обновить корзину (позиции, модификаторы, количество)
      description: >-
        Заменяет состав корзины целиком (до 50 строк; количество 1…99; до 20
        модификаторов на строку; одинаковые строки — `400`) и пересчитывает суммы по
        актуальным ценам menu-service (`validateMenuItems`; таймаут 800 мс, один
        ретрай, circuit breaker). Пустой список очищает корзину. Недоступные позиции
        (E1) **удаляются из корзины**, остальные сохраняются, ответ — `409`
        `ITEMS_UNAVAILABLE` со списком `unavailableItems`; актуальный состав — `getCart`.
        menu недоступен → `503 MENU_UNAVAILABLE`, корзина не меняется (MG2).
        Заказанная/отменённая корзина — `409 CART_CLOSED`.
      parameters:
        - { $ref: '#/components/parameters/CartId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemsUpdate' }
      responses:
        '200':
          description: Обновлённая корзина (состав, применённые акции, сумма)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Позиция недоступна — состав скорректирован (`ITEMS_UNAVAILABLE`, E1) либо
            корзина закрыта (`CART_CLOSED`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/UnavailableItemsProblem' }
        '503':
          description: menu-service недоступен (`MENU_UNAVAILABLE`)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }

  /carts/{cartId}/fulfillment:
    put:
      tags: [orders-service]
      operationId: setCartFulfillment
      x-status: implemented
      summary: Выбрать/сменить способ получения
      description: >-
        Устанавливает способ получения (доставка / самовывоз) и, при доставке, адрес
        (`ADDRESS_REQUIRED`, если пуст; ресторан должен поддерживать доставку —
        `DELIVERY_NOT_AVAILABLE`). **S7:** у адреса обязательны координаты
        (`ADDRESS_LOCATION_REQUIRED`), а адрес должен быть в радиусе доставки ресторана
        (`ADDRESS_OUT_OF_ZONE`, расширения `distanceMeters`/`radiusMeters`, `hint=pickup`).
        (UC-ORD-01, UC-RCV-01)
      parameters:
        - { $ref: '#/components/parameters/CartId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FulfillmentInput' }
      responses:
        '200':
          description: Способ получения зафиксирован, сумма пересчитана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: Корзина закрыта (`CART_CLOSED`)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '422':
          description: >-
            `ADDRESS_REQUIRED`, `ADDRESS_LOCATION_REQUIRED`, `ADDRESS_OUT_OF_ZONE`,
            `DELIVERY_NOT_AVAILABLE`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/OutOfZoneProblem' }
        '503':
          description: restaurant-service недоступен (`RESTAURANT_UNAVAILABLE`)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }

  /orders:
    post:
      tags: [orders-service]
      operationId: createOrder
      x-status: implemented
      summary: Оформить заказ
      description: >-
        Фиксирует финальный состав и сумму, присваивает номер и создаёт заказ на
        основе корзины. Порядок (ADR-10): проверка ресторана (открыт — E2) и повторная
        проверка позиций/цен в menu-service (E1) → одна транзакция: заказ, история
        статусов, события `orders.state` (`revision=1`) и `orders.status` в outbox,
        корзина закрывается, ответ сохраняется под `Idempotency-Key`. Начальный статус:
        `pending_payment` для онлайн-оплаты, `accepted` для оплаты курьеру/на кассе.
        Заказ не уходит в производство, пока не оплачен (см. payment-service, S3).


        `Idempotency-Key` **обязателен**; повтор с тем же ключом и телом возвращает тот
        же `201` (заголовок `Idempotent-Replay: true`) без нового заказа; тот же ключ с
        другим телом — `422 IDEMPOTENCY_KEY_REUSED`; параллельный дубликат — `409
        IDEMPOTENCY_IN_PROGRESS`. Корзину можно оформить один раз (`409 CART_CLOSED`).
        Если цены изменились с момента расчёта корзины — `409 PRICE_CHANGED`, корзина
        обновлена, клиент подтверждает новую сумму и повторяет запрос с новым ключом.
        Может создаваться клиентом (UC-ORD-03) или сотрудником от имени клиента
        (`channel=staff_fax`, UC-ORD-02, S6): нужна роль персонала с доступом к ресторану корзины
        (корзину сотрудник создаёт сам, `POST /carts`), `contact.phone` клиента обязателен,
        способ оплаты — только `pos` (самовывоз) или `courier_card` (доставка): клиента у кассы
        нет, онлайн-оплата невозможна. Заказ принадлежит клиенту-гостю, сотрудник записывается
        в журнал статусов; в `orders.state` `source=fax`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '201':
          description: Заказ создан, присвоен номер
          headers:
            Location: { $ref: '_common.yaml#/components/headers/Location' }
            Idempotent-Replay:
              description: '`true`, если это повтор уже обработанного запроса.'
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401':
          description: '`UNAUTHORIZED` — `channel=staff_fax` без аутентификации'
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '403':
          description: '`FORBIDDEN` — `channel=staff_fax` без роли персонала или для ресторана вне привязки сотрудника'
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '404':
          description: Корзина не найдена (`CART_NOT_FOUND`)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '409':
          description: >-
            `ITEMS_UNAVAILABLE` (E1; список в `unavailableItems`), `PRICE_CHANGED`,
            `RESTAURANT_CLOSED` (E2), `CART_CLOSED`, `CART_CHANGED` (корзина изменена
            параллельно), `IDEMPOTENCY_IN_PROGRESS`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/UnavailableItemsProblem' }
        '422':
          description: >-
            `CART_EMPTY`, `FULFILLMENT_REQUIRED`, `CONTACT_REQUIRED`,
            `PAYMENT_METHOD_NOT_ALLOWED` (для `staff_fax` — и `online_card`), `IDEMPOTENCY_KEY_REUSED`,
            `DELIVERY_NOT_AVAILABLE`, `ADDRESS_LOCATION_REQUIRED`, `ADDRESS_OUT_OF_ZONE` (S7: повторная
            проверка зоны; расширения `distanceMeters`/`radiusMeters`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/OutOfZoneProblem' }
        '503':
          description: menu-/restaurant-service недоступны (`MENU_UNAVAILABLE`, `RESTAURANT_UNAVAILABLE`); корзина сохранена
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }

  /orders/{orderId}:
    get:
      tags: [orders-service]
      operationId: getOrder
      x-status: implemented
      summary: Получить заказ
      parameters:
        - { $ref: '_common.yaml#/components/parameters/OrderId' }
      responses:
        '200':
          description: Данные заказа (состав, статус, суммы, способ получения/оплаты)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /orders/{orderId}/eta:
    get:
      tags: [orders-service]
      operationId: getOrderEta
      x-status: implemented
      summary: Просмотреть время получения заказа
      description: >-
        Возвращает ориентировочное время готовности (для самовывоза) или доставки.
        Оценка считается из локальной реплики загрузки производства
        (`production.lead.time`) без синхронного обращения к системе производства (S4):
        `readyAt` = момент принятия заказа (`accepted`) + `leadTimeMinutes` ресторана;
        для самовывоза со слотом — не раньше начала слота. Реплика свежая →
        `approximate=false`. Реплики нет или она устарела (производство молчит, E1) →
        типовое время (настраивается) и `approximate=true`; сам заказ при этом не теряется.
        Для заказа, уже ставшего `ready`, `readyAt` — момент готовности, `estimateMinutes=0`.


        **Доставка (S7).** `deliveryAt` — время вручения. Если delivery-service сообщил оценку
        курьерской системы (`etaAt` в `orders.delivery.status`, не старше срока годности), то
        `deliveryAt` = она и `approximate=false` (при условии свежей оценки производства или
        готового заказа); иначе — `readyAt` + типовое время доставки (`ETA_DELIVERY_MINUTES`)
        и `approximate=true`. Для доставленного заказа `deliveryAt` — фактическое время
        `delivered`. (UC-ORD-05, UC-RCV-02)
      parameters:
        - { $ref: '_common.yaml#/components/parameters/OrderId' }
      responses:
        '200':
          description: Ориентировочное время получения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Eta' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /orders/{orderId}/pickup-slot:
    put:
      tags: [orders-service]
      operationId: setPickupSlot
      x-status: implemented
      summary: Зафиксировать желаемый интервал получения
      description: >-
        Сохраняет выбранный клиентом интервал получения (отложенное время, UC-ORD-05
        A1). Только для самовывоза и только пока заказ в `pending_payment|accepted`
        (`409 ORDER_STATE_CONFLICT`). Интервал: `from < to`, `from` не в прошлом,
        длительность ≤ 4 ч, не дальше 7 суток вперёд (`422 INVALID_SLOT`); совпадение
        с режимом работы ресторана — S4. Изменение публикует `orders.state` с
        `revision+1`.
      parameters:
        - { $ref: '_common.yaml#/components/parameters/OrderId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupSlotInput' }
      responses:
        '200':
          description: Интервал получения сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: Заказ нельзя менять в текущем статусе (`ORDER_STATE_CONFLICT`)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableEntity' }

  /orders/search:
    get:
      tags: [orders-service]
      operationId: searchOrder
      x-status: implemented
      summary: Поиск заказа по номеру (персонал)
      description: >-
        Поиск заказа сотрудником кафе по номеру для выдачи; только заказы ресторанов,
        к которым привязан сотрудник (`HQ_STAFF` — любые). Номер сопоставляется без учёта
        регистра и пробелов по краям. Заказ чужого ресторана неотличим от несуществующего:
        `404 ORDER_NOT_FOUND` — уточнить данные клиента или эскалировать (E1). В ответ,
        в отличие от `getOrder`, входят контакты клиента (для сверки при выдаче). (UC-RCV-03)
      security:
        - bearerAuth: [orders:staff]
      parameters:
        - name: number
          in: query
          required: true
          description: 'Номер заказа, формат `R<код>-<YYMMDD>-<NNNN>`'
          schema: { type: string, example: R1-261021-0007 }
      responses:
        '200':
          description: Заказ найден
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOrder' }
        '400':
          description: '`INVALID_PARAMETER` / `INVALID_ORDER_NUMBER` — номер не указан или не соответствует формату'
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: Заказ не найден или принадлежит другому ресторану (E1, `ORDER_NOT_FOUND`)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/issuance:
    post:
      tags: [orders-service]
      operationId: markOrderIssued
      x-status: implemented
      summary: Отметить выдачу заказа (персонал)
      description: >-
        Фиксирует факт выдачи заказа клиенту (`ready → handed_over → closed`, одна транзакция,
        два события `orders.status`). Доступно сотруднику ресторана заказа при получении в
        ресторане (самовывоз). **S7:** заказ с доставкой выдаётся в ресторане только если
        доставка не состоялась из-за отсутствия курьера (`delivery.status=failed`,
        `failReason=no_courier`) — клиент принял предложение забрать заказ сам (E2). Условия:
        статус `ready`, `paymentStatus=paid`. Если оплата
        `pos` ещё не принята — `409 ORDER_NOT_PAID`: сначала `initiatePosPayment`. Повтор для
        уже выданного (`closed` через `handed_over`) заказа — `200` без эффекта.
        (UC-RCV-03, UC-RCV-01)
      security:
        - bearerAuth: [orders:staff]
      parameters:
        - { $ref: '_common.yaml#/components/parameters/OrderId' }
      responses:
        '200':
          description: Выдача зафиксирована, заказ закрыт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            `ORDER_STATE_CONFLICT` (заказ не `ready`: ещё готовится, отменён, не получен),
            `ORDER_NOT_PAID` (оплата не принята)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '422':
          description: >-
            `NOT_PICKUP_ORDER` — заказ с доставкой выдаёт курьер (исключение — `failed/no_courier`,
            см. выше)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/cancellation:
    post:
      tags: [orders-service]
      operationId: cancelOrder
      x-status: implemented
      summary: Отменить заказ (персонал)
      description: >-
        Отменяет заказ в статусе `pending_payment` или `accepted` (до начала приготовления;
        дальше — `409 ORDER_STATE_CONFLICT`). Публикует `orders.status` (`cancelled`,
        `reason` = код причины). Оплаченный заказ возвращает деньги payment-service
        (`Order.refundStatus`: `pending` → `refunded`); неоплаченную онлайн-операцию он
        отменяет у шлюза. Повтор для уже отменённого заказа — `200` без эффекта.
      security:
        - bearerAuth: [orders:staff]
      parameters:
        - { $ref: '_common.yaml#/components/parameters/OrderId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderRequest' }
      responses:
        '200':
          description: Заказ отменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: Заказ нельзя отменить в текущем статусе (`ORDER_STATE_CONFLICT`)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }

components:

  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    CartId:
      name: cartId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Уникальный ключ (1–128 печатных ASCII-символов), гарантирующий однократное
        создание заказа при повторной отправке.
      schema: { type: string, minLength: 1, maxLength: 128 }

  schemas:
    FulfillmentType:
      type: string
      enum: [delivery, pickup]
    ContactInfo:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        phone: { type: string, pattern: '^\+[1-9][0-9]{6,14}$', description: E.164 }
        email: { type: string, format: email, maxLength: 254 }
    Address:
      type: object
      properties:
        raw: { type: string, maxLength: 300 }
        location:
          allOf:
            - $ref: '_common.yaml#/components/schemas/GeoPoint'
          description: >-
            Координаты адреса от карты клиента. Для доставки обязательны (S7,
            `ADDRESS_LOCATION_REQUIRED`); для самовывоза не нужны.
    CartItemInput:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        modifierIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
    CartItem:
      type: object
      required: [menuItemId, quantity, modifierIds, name, unitPrice, lineTotal, available]
      properties:
        menuItemId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        modifierIds:
          type: array
          items: { type: string, format: uuid }
        name: { type: string, description: Название позиции на момент расчёта (снапшот). }
        unitPrice:
          allOf:
            - $ref: '_common.yaml#/components/schemas/Money'
          description: Цена за единицу с модификаторами на момент расчёта.
        lineTotal: { $ref: '_common.yaml#/components/schemas/Money' }
        available:
          type: boolean
          description: В корзине и заказе всегда `true`; недоступные позиции удаляются.
    CartCreateRequest:
      type: object
      required: [restaurantId]
      properties:
        restaurantId: { type: string, format: uuid }
        guest:
          type: boolean
          description: Гостевое оформление без авторизации (UC-ORD-03 A1).
        contact: { $ref: '#/components/schemas/ContactInfo' }
    CartItemsUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CartItemInput' }
    AppliedPromotion:
      type: object
      properties:
        promotionId: { type: string, format: uuid }
        title: { type: string }
        discount: { $ref: '_common.yaml#/components/schemas/Money' }
    Cart:
      type: object
      required: [id, restaurantId, status, items, appliedPromotions, subtotal, discountTotal, total]
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        status:
          type: string
          enum: [open, ordered]
          description: '`ordered` — корзина оформлена в заказ и изменению не подлежит.'
        orderId: { type: string, format: uuid, description: 'Заказ, созданный из корзины.' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        appliedPromotions:
          type: array
          items: { $ref: '#/components/schemas/AppliedPromotion' }
        fulfillment: { $ref: '#/components/schemas/FulfillmentInfo' }
        subtotal: { $ref: '_common.yaml#/components/schemas/Money' }
        discountTotal: { $ref: '_common.yaml#/components/schemas/Money' }
        total: { $ref: '_common.yaml#/components/schemas/Money' }
    FulfillmentInput:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/FulfillmentType' }
        address:
          $ref: '#/components/schemas/Address'
    FulfillmentInfo:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/FulfillmentType' }
        address: { $ref: '#/components/schemas/Address' }
    PickupSlotInput:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    OrderCreateRequest:
      type: object
      required: [cartId, paymentMethod]
      properties:
        cartId: { type: string, format: uuid }
        paymentMethod:
          $ref: '_common.yaml#/components/schemas/PaymentMethodType'
        contact:
          allOf:
            - $ref: '#/components/schemas/ContactInfo'
          description: >-
            Контакты клиента; переопределяют контакты корзины. Для гостя обязателен
            `phone` (`CONTACT_REQUIRED`).
        channel:
          type: string
          enum: [online, staff_fax]
          default: online
          description: >-
            Канал оформления (клиент онлайн / сотрудник по факсу). `staff_fax` — только для
            персонала (см. описание `createOrder`).
    OrderStatus:
      type: string
      enum: [pending_payment, accepted, cooking, ready, on_delivery, delivered, handed_over, closed, not_received, cancelled]
      description: >-
        Совпадает с `orders.status` (AsyncAPI) плюс стартовый `pending_payment`.
        Допустимые переходы: `pending_payment→{accepted,cancelled}`,
        `accepted→{cooking,cancelled}`, `cooking→ready`, `ready→{handed_over,on_delivery,not_received}`,
        `on_delivery→{delivered,not_received}`, `{delivered,handed_over,not_received}→closed`.
    Order:
      type: object
      required: [id, number, restaurantId, status, paymentStatus, paymentMethod, items, fulfillment, subtotal, discountTotal, total, createdAt]
      properties:
        id: { type: string, format: uuid }
        number:
          type: string
          description: Человекочитаемый номер, уникален глобально, формат `R<ресторан>-<YYMMDD>-<NNNN>` (счётчик на ресторан и день).
          example: R2-261018-0007
        restaurantId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusReason:
          type: string
          description: >-
            Причина статуса: `paid`, `payment_timeout`, `pickup_timeout`, `issued`, `courier_picked_up`,
            `delivered`, `undelivered` (S7) или код причины отмены персоналом (`customer_request`,
            `out_of_stock`, `restaurant_closed`, `other`).
        channel:
          type: string
          enum: [online, staff_fax]
        paymentStatus: { $ref: '_common.yaml#/components/schemas/PaymentStatus' }
        refundStatus:
          allOf:
            - $ref: '_common.yaml#/components/schemas/RefundStatus'
          description: Есть только у оплаченного заказа, по которому возвращаются деньги.
        paymentMethod: { $ref: '_common.yaml#/components/schemas/PaymentMethodType' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        fulfillment: { $ref: '#/components/schemas/FulfillmentInfo' }
        pickupSlot: { $ref: '#/components/schemas/PickupSlot' }
        subtotal: { $ref: '_common.yaml#/components/schemas/Money' }
        discountTotal: { $ref: '_common.yaml#/components/schemas/Money' }
        total: { $ref: '_common.yaml#/components/schemas/Money' }
        eta: { $ref: '#/components/schemas/Eta' }
        delivery:
          $ref: '#/components/schemas/OrderDelivery'
        createdAt: { type: string, format: date-time }
    OrderDelivery:
      type: object
      required: [status]
      description: >-
        Снимок доставки из `orders.delivery.status` (только заказ с доставкой, после первого
        события delivery-service). Подробности (курьер, координаты) — `getDeliveryInfo` и
        `getCourierLocation` (delivery.yaml).
      properties:
        status:
          type: string
          enum: [searching, assigned, picked_up, en_route, delivered, failed]
        failReason:
          type: string
          enum: [no_courier, undelivered, cancelled]
        hint:
          type: string
          enum: [pickup]
          description: '`pickup` при `failed/no_courier`: предложить клиенту забрать заказ в ресторане (E2).'
        etaAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OutOfZoneProblem:
      description: >-
        Problem Details; при `ADDRESS_OUT_OF_ZONE` содержит расстояние до ресторана, радиус
        доставки и подсказку `pickup`.
      allOf:
        - $ref: '_common.yaml#/components/schemas/Problem'
        - type: object
          properties:
            distanceMeters: { type: integer, minimum: 0 }
            radiusMeters: { type: integer, minimum: 0 }
            hint: { type: string, enum: [pickup] }
    StaffOrder:
      description: Заказ с контактами клиента — ответ `searchOrder`.
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            contact: { $ref: '#/components/schemas/ContactInfo' }
            createdBy:
              type: string
              description: Сотрудник, оформивший заказ (только `channel=staff_fax`).
    CancelOrderRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [customer_request, out_of_stock, restaurant_closed, other]
          description: Код причины; попадает в `orders.status.reason` и в журнал статусов.
    PickupSlot:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    Eta:
      type: object
      properties:
        readyAt: { type: string, format: date-time }
        deliveryAt: { type: string, format: date-time }
        estimateMinutes: { type: integer }
        approximate:
          type: boolean
          description: >-
            true — показано типовое время, потому что свежей оценки производства нет (E1):
            реплика `production.lead.time` отсутствует или устарела. false — время
            рассчитано по свежей загрузке ресторана.
    UnavailableItem:
      type: object
      required: [menuItemId, reasonCode]
      properties:
        menuItemId: { type: string, format: uuid }
        reasonCode:
          $ref: 'menu.yaml#/components/schemas/ValidationReasonCode'
        reason: { type: string }
    UnavailableItemsProblem:
      description: Problem Details; при `ITEMS_UNAVAILABLE` содержит `unavailableItems`.
      allOf:
        - $ref: '_common.yaml#/components/schemas/Problem'
        - type: object
          properties:
            unavailableItems:
              type: array
              items: { $ref: '#/components/schemas/UnavailableItem' }
