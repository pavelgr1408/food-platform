openapi: 3.1.0

info:
  title: auth-service — REST API
  version: 1.3.0
  description: |-
    Идентификация и доступ: регистрация, вход по телефону, токены, публичные ключи (JWKS),
    проверка токена и полномочий. Хранилище — auth-db.
    Общие компоненты — `_common.yaml`.

    **Статус реализации** (`x-status` на операциях):
    `implemented` — есть в `services/auth`; `planned` — целевая архитектура, не реализовано.
    С S5 (версия 1.3.0) все операции этого контракта — `implemented`.

    **Проверка токена (ADR-11).** api-gateway и сервисы проверяют JWT **локально** по
    `GET /auth/.well-known/jwks.json` (RS256, кэш с учётом `kid`), а не вызовом auth на каждый
    запрос. `POST /auth/introspect` — онлайн-проверка для чувствительных операций
    (учитывает блокировку пользователя). Операция `verifyToken` (`/auth/token/verify`) из ДЗ-1
    **удалена**: её заменяют JWKS + `introspect`.

    **Что в токене (S5).** Access-токен несёт всё нужное для авторизации без сетевого вызова:
    `sub` (userId), `roles[]`, `restaurants[]` (рестораны, к которым привязан сотрудник или
    владелец франшизы; у `CUSTOMER` и `HQ_STAFF` — пусто), `phone`, `iss`, `aud`, `exp`, `iat`, `jti`.
    Изменение ролей/привязки действует с выдачей следующего токена (≤ TTL access-токена);
    немедленный эффект — через `introspect`/`authorize`.

    **Ротация ключа без простоя.** JWKS содержит текущий ключ подписи и предыдущие публичные ключи,
    пока не истёк их срок (TTL access-токена). Потребители перечитывают набор при неизвестном `kid`.

    **Внутренние операции.** `introspect` и `authorize` предназначены для вызовов из кластера
    (`x-internal: true`); api-gateway **не публикует** их наружу.

    **Формат ошибок.** С S5 — Problem Details (RFC 9457, `application/problem+json`, схема `Problem`
    из `_common.yaml`) с машиночитаемым `code`; наследие `AuthError` удалено.

servers:
  - url: https://api.blt.example/v1
    description: Единая точка входа (api-gateway)
  - url: http://localhost:8081
    description: Локальный запуск (`go run` / docker compose)

security:
  - bearerAuth: []

tags:
  - name: auth-service

paths:

  /auth/register:
    post:
      tags: [auth-service]
      operationId: register
      x-status: implemented
      summary: Регистрация клиента
      description: >-
        Создаёт пользователя с ролью `CUSTOMER` и статусом `ACTIVE`. Идентификатор —
        телефон в формате E.164, уникален. Пароль хранится как bcrypt-хэш.
        Ошибки: `400 VALIDATION_FAILED|INVALID_JSON`, `409 PHONE_ALREADY_REGISTERED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Телефон уже зарегистрирован
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth-service]
      operationId: login
      x-status: implemented
      summary: Вход по телефону и паролю
      description: >-
        Выдаёт пару токенов: access (JWT RS256, короткий TTL) и refresh (непрозрачный,
        одноразовый). Одинаковый ответ 401 на неверный пароль и неизвестный телефон
        (нет перечисления пользователей). Используется всеми клиентскими и персональными
        приложениями. Коды: `401 INVALID_CREDENTIALS`, `403 USER_NOT_ACTIVE`. На api-gateway
        для этого пути действует отдельный, более строгий лимит запросов (защита от подбора пароля).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Неверный телефон или пароль
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '403':
          description: Пользователь не активен (заблокирован, удалён, не подтверждён)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth-service]
      operationId: refreshTokens
      x-status: implemented
      summary: Обновить пару токенов
      description: >-
        Ротация refresh-токена: старый отзывается атомарно, выдаётся новая пара.
        Повторное использование старого токена — `401 INVALID_REFRESH_TOKEN`; просроченный —
        `401 REFRESH_TOKEN_EXPIRED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Refresh-токен неизвестен, отозван или просрочен
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '403':
          description: Пользователь не активен
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }

  /auth/logout:
    post:
      tags: [auth-service]
      operationId: logout
      x-status: implemented
      summary: Выход (отзыв refresh-токена)
      description: >-
        Отзывает переданный refresh-токен. Выданные access-токены остаются действительными
        до истечения TTL (отзыв «сейчас же» — через `introspect` на чувствительных путях).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Токен отозван
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: Logged out successfully }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Refresh-токен неизвестен, уже отозван или просрочен
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }

  /auth/me:
    get:
      tags: [auth-service]
      operationId: getCurrentPrincipal
      x-status: implemented
      summary: Текущий пользователь
      responses:
        '200':
          description: Данные текущего субъекта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '401':
          description: Токен отсутствует, недействителен или просрочен
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }
        '403':
          description: Пользователь не активен
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/Problem' }

  /auth/introspect:
    post:
      tags: [auth-service]
      operationId: introspectToken
      x-status: implemented
      x-internal: true
      summary: Онлайн-проверка access-токена (internal)
      description: >-
        Проверяет подпись, срок и **актуальность пользователя** (заблокированный → `active=false`).
        Всегда отвечает 200: недействительный токен — `{"active": false}` без данных субъекта
        (RFC 7662). Только для вызовов из кластера (api-gateway не публикует путь наружу; в S11 — NetworkPolicy);
        gateway использует для чувствительных маршрутов (создание заказа, оплата) вместо проверки
        только по JWKS.
        Заменяет `verifyToken` из ДЗ-1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Access-токен (JWT) }
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntrospectionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/.well-known/jwks.json:
    get:
      tags: [auth-service]
      operationId: getJwks
      x-status: implemented
      summary: Публичные ключи подписи (JWKS)
      description: >-
        Набор публичных ключей RS256 (`kid` совпадает с заголовком JWT). Потребители кэшируют
        набор и перечитывают его при неизвестном `kid` (ротация ключа без простоя).
      security: []
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/authorize:
    post:
      tags: [auth-service]
      operationId: authorize
      x-status: implemented
      x-internal: true
      summary: Проверить полномочия субъекта на действие (internal)
      description: |-
        Решает, может ли **владелец Bearer-токена** выполнить действие. Решение принимается по
        **актуальным данным БД** (статус, роли, привязка к ресторанам), а не по claims токена, —
        поэтому блокировка и смена привязки действуют сразу. Вызывающий сервис передаёт
        токен пользователя как есть. Отказ — **не ошибка**: `200`, `allowed=false` и `reason`.

        Каталог действий (`action`):

        | action | scope | Кто допускается |
        |---|---|---|
        | `promotion.manage` | `local` + `restaurantId` | `FRANCHISE_OWNER`, привязанный к этому ресторану; `HQ_STAFF` |
        | `promotion.manage` | `national` | только `HQ_STAFF` |
        | `order.manage` | `restaurantId` обязателен | `STAFF` или `FRANCHISE_OWNER`, привязанные к ресторану; `HQ_STAFF` |

        `reason` для отказа: `NOT_ACTIVE`, `ROLE_REQUIRED`, `NOT_BOUND_TO_RESTAURANT`, `SCOPE_NOT_ALLOWED`.
        Неизвестное `action` или неполный запрос (нет `restaurantId`/`scope`, где они обязательны) —
        `400` (`UNKNOWN_ACTION` / `VALIDATION_FAILED`).
        Для простых проверок по ролям достаточно локального анализа токена (`roles`, `restaurants`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizeRequest' }
      responses:
        '200':
          description: Решение по авторизации
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizeDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '_common.yaml#/components/responses/Unauthorized' }

components:

  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'

  responses:
    BadRequest:
      description: >-
        Некорректный запрос: невалидный JSON (`INVALID_JSON`) или поля (`VALIDATION_FAILED`:
        `phone` не E.164, пароль вне 6–72 символов, пустой токен).
      content:
        application/problem+json:
          schema: { $ref: '_common.yaml#/components/schemas/Problem' }
    TooManyRequests:
      description: Превышен лимит запросов (rate limit на api-gateway; заголовок `Retry-After`, секунды)
      content:
        application/problem+json:
          schema: { $ref: '_common.yaml#/components/schemas/Problem' }

  schemas:
    Credentials:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          example: '+79991234567'
          description: Телефон в формате E.164
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 72
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    RegisteredUser:
      type: object
      required: [userId, phone, status]
      properties:
        userId: { type: string, format: uuid }
        phone: { type: string, example: '+79991234567' }
        status: { $ref: '#/components/schemas/UserStatus' }
    UserStatus:
      type: string
      enum: [ACTIVE, BLOCKED, DELETED, PENDING_VERIFICATION]
    Role:
      type: string
      description: |
        Роли платформы: `CUSTOMER` — клиент, `STAFF` — сотрудник кафе,
        `FRANCHISE_OWNER` — владелец франшизы, `HQ_STAFF` — сотрудник головной компании.
        `STAFF` и `FRANCHISE_OWNER` привязаны к ресторанам (`restaurants[]`); `HQ_STAFF` видит всё.
        Прежние роли Java-версии (`ADMIN`, `COURIER`, `KITCHEN`) удалены в 1.3.0
        (`ADMIN` → `HQ_STAFF`; курьер и кухня — внешние системы).
      enum: [CUSTOMER, STAFF, FRANCHISE_OWNER, HQ_STAFF]
    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: >-
            JWT RS256. Заголовок: `kid`; claims: `sub` (userId), `phone`, `roles`, `restaurants`
            (UUID ресторанов привязки; может быть пустым), `iss`, `aud`, `exp`, `iat`, `jti`.
        refreshToken: { type: string, description: Непрозрачный одноразовый токен }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: 'TTL access-токена, сек', example: 900 }
    Principal:
      type: object
      required: [userId, phone, roles, status]
      properties:
        userId: { type: string, format: uuid }
        phone: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        restaurants:
          type: array
          description: Привязка сотрудника/владельца к ресторанам (`user_restaurants`); пусто у CUSTOMER и HQ_STAFF.
          items: { type: string, format: uuid }
    IntrospectionResult:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        userId: { type: string, format: uuid }
        phone: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        restaurants:
          type: array
          items: { type: string, format: uuid }
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, use, alg, n, e]
            properties:
              kty: { type: string, enum: [RSA] }
              kid: { type: string, example: local-dev-key }
              use: { type: string, enum: [sig] }
              alg: { type: string, enum: [RS256] }
              n: { type: string, description: Модуль (base64url) }
              e: { type: string, description: Экспонента (base64url), example: AQAB }
    AuthorizeRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [promotion.manage, order.manage]
          example: promotion.manage
        scope:
          type: string
          enum: [local, national]
          description: Область действия; обязательна для `promotion.manage`.
        restaurantId:
          type: string
          format: uuid
          description: Ресторан, к которому проверяется привязка (для `local` и `order.manage`).
    AuthorizeDecision:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
        reason:
          type: string
          enum: [NOT_ACTIVE, ROLE_REQUIRED, NOT_BOUND_TO_RESTAURANT, SCOPE_NOT_ALLOWED]
          description: Причина отказа; у `allowed=true` отсутствует.
