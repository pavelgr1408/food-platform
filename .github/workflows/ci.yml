name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: make fmt-check
      - run: go vet ./...
      - uses: dominikh/staticcheck-action@v1.3.1
        with: { version: "2025.1.1", install-go: false }
      - name: tests (race, with Postgres)
        run: go test -race -count=1 ./...
      - name: service template generates a buildable service
        run: make check-template

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: make lint-contracts

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/requirements.txt
      - uses: azure/setup-helm@v4
      - run: make helm-lint
      - name: compose files are valid
        run: |
          docker compose --project-directory . -f deploy/compose/infra.yml config -q
          for f in deploy/compose/services/*.yml; do
            docker compose --project-directory . -f deploy/compose/infra.yml -f "$f" config -q
          done

  images:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build auth image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            SRC=services/auth
            TARGET=./services/auth/cmd/auth-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build mock-externals image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            SRC=tools/mock-externals
            TARGET=./tools/mock-externals
          push: false
          cache-from: type=gha

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
