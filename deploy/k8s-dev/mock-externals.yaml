# Моки внешних систем (платёжный шлюз, касса, производство) ДЛЯ SMOKE в локальном k8s. Образ: food/mock-externals:dev
# (собирает tools/k8s-smoke/up.sh). Адреса вебхуков — внутрь кластера, напрямую в Service payment (минуя ingress).
apiVersion: apps/v1
kind: Deployment
metadata: { name: mock-externals, labels: { app.kubernetes.io/name: mock-externals, app.kubernetes.io/part-of: food-platform } }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: mock-externals } }
  template:
    metadata: { labels: { app.kubernetes.io/name: mock-externals, app.kubernetes.io/part-of: food-platform } }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mock-externals
          image: food/mock-externals:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: MOCKS, value: "ping,payment,pos,production" }
            - { name: MOCK_DELAY, value: 2s }
            - { name: KAFKA_BROKERS, value: "kafka:9092" }
            - { name: MOCK_PAYMENT_WEBHOOK_URL, value: "http://payment/webhooks/payments/gateway" }
            - { name: MOCK_POS_WEBHOOK_URL, value: "http://payment/webhooks/payments/pos" }
            - { name: MOCK_PRODUCTION_QUEUE_DELAY, value: 2s }
            - { name: MOCK_PRODUCTION_COOK_TIME, value: 3s }
          ports:
            - { name: ping, containerPort: 9090 }
            - { name: gateway, containerPort: 9091 }
            - { name: production, containerPort: 9092 }
            - { name: pos, containerPort: 9093 }
          readinessProbe: { httpGet: { path: /_admin/health, port: 9091 }, periodSeconds: 5 }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 96Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: mock-externals, labels: { app.kubernetes.io/name: mock-externals, app.kubernetes.io/part-of: food-platform } }
spec:
  selector: { app.kubernetes.io/name: mock-externals }
  ports:
    - { name: ping, port: 9090, targetPort: ping }
    - { name: gateway, port: 9091, targetPort: gateway }
    - { name: production, port: 9092, targetPort: production }
    - { name: pos, port: 9093, targetPort: pos }
