# Одноузловой Kafka (KRaft) ДЛЯ SMOKE в локальном k8s. НЕ для прода: данные в emptyDir, одна реплика, без аутентификации.
# Конфигурация повторяет deploy/compose/infra.yml (listener INTERNAL kafka:9092), внешнего listener нет.
# Топики создаёт Job kafka-topics из deploy/compose/kafka/topics.txt (ConfigMap kafka-init создаёт tools/k8s-smoke/up.sh).
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: food-platform } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: kafka } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: food-platform } }
    spec:
      enableServiceLinks: false # иначе k8s подставит KAFKA_PORT=tcp://… и сломает конфиг образа apache/kafka
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "24" }
          ports: [{ name: kafka, containerPort: 9092 }]
          # tcpSocket, а не kafka-broker-api-versions: advertised-адрес kafka:9092 резолвится в Service,
          # у которого нет endpoints, пока pod не Ready — exec-проба через advertised-адрес зашла бы в тупик.
          readinessProbe: { tcpSocket: { port: 9092 }, initialDelaySeconds: 10, periodSeconds: 5, failureThreshold: 30 }
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: kafka, labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: food-platform } }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: kafka }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: kafka-topics, labels: { app.kubernetes.io/name: kafka-topics, app.kubernetes.io/part-of: food-platform } }
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: topics
          image: apache/kafka:3.9.0
          command: ["/bin/bash", "/init/create-topics.sh"]
          env: [{ name: BOOTSTRAP, value: "kafka:9092" }]
          volumeMounts: [{ name: init, mountPath: /init, readOnly: true }]
      volumes: [{ name: init, configMap: { name: kafka-init } }]
