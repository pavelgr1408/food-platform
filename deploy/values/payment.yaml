# Helm-values сервиса payment для общего чарта deploy/charts/service.
# Секреты в git не хранятся: Secret `payment-secrets` создаёт `make k8s-dev-secrets` / CI/CD / Vault.
name: payment
image:
  repository: food/payment
  tag: dev
port: 8085
replicas: 2
env:
  APP_ENV: dev
  LOG_LEVEL: info
  AUTH_MODE: dev
  KAFKA_BROKERS: kafka:9092
  GATEWAY_URL: http://mock-externals:9091 # dev: мок шлюза; в prod — адрес реального шлюза
  GATEWAY_TIMEOUT: 5s
  WEBHOOK_WAIT: 30s
  PENDING_EXPIRY: 10m
existingSecret: payment-secrets # ключи: DATABASE_URL, GATEWAY_API_KEY, GATEWAY_WEBHOOK_SECRET, POS_WEBHOOK_SECRET
migrations:
  enabled: true # Job `payment-service --migrate-only` (pre-install/pre-upgrade hook)
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 192Mi }
ingress:
  paths: [] # публичные пути добавляются, когда готов gateway (S5)
