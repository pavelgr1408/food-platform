# Helm-values сервиса payment для общего чарта deploy/charts/service.
# Секреты в git не хранятся: Secret `payment-secrets` создаёт `make k8s-dev-secrets` / CI/CD / Vault.
name: payment
image:
  repository: food/payment
  tag: dev
port: 8085
replicas: 2
env:
  APP_ENV: dev
  LOG_LEVEL: info
  AUTH_MODE: jwks # личность — только из JWT, проверенного локально по JWKS (ADR-11)
  AUTH_JWKS_URL: http://auth/auth/.well-known/jwks.json
  KAFKA_BROKERS: kafka:9092
  GATEWAY_URL: http://mock-externals:9091 # dev: мок шлюза; в prod — адрес реального шлюза
  POS_URL: http://mock-externals:9093 # dev: мок кассы; в prod — адрес кассовой системы
  GATEWAY_TIMEOUT: 5s
  WEBHOOK_WAIT: 30s
  PENDING_EXPIRY: 10m
existingSecret: payment-secrets # ключи: DATABASE_URL, GATEWAY_API_KEY, GATEWAY_WEBHOOK_SECRET, POS_API_KEY, POS_WEBHOOK_SECRET
migrations:
  enabled: true # Job `payment-service --migrate-only` (pre-install/pre-upgrade hook)
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 192Mi }
ingress:
  # Единственный путь мимо gateway: вебхуки платёжного шлюза (подпись HMAC вместо токена).
  # Ограничения — на ingress, до сервиса: частота по IP отправителя и размер тела.
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
  paths:
    - { path: /webhooks/payments, pathType: Prefix }
