# Helm-values сервиса menu для общего чарта deploy/charts/service.
# Секреты в git не хранятся: Secret `menu-secrets` создаёт `make k8s-dev-secrets` / CI/CD / Vault.
name: menu
image:
  repository: food/menu
  tag: dev
port: 8083
replicas: 2
env:
  APP_ENV: dev
  LOG_LEVEL: info
  AUTH_MODE: jwks # личность — только из JWT, проверенного локально по JWKS (ADR-11)
  AUTH_JWKS_URL: http://auth/auth/.well-known/jwks.json
existingSecret: menu-secrets # ключи: DATABASE_URL
migrations:
  enabled: true # Job `menu-service --migrate-only` (pre-install/pre-upgrade hook)
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 192Mi }
ingress:
  paths: [] # снаружи сервис доступен только через gateway
