# Helm-values сервиса restaurant для общего чарта deploy/charts/service.
# Секреты в git не хранятся: Secret `restaurant-secrets` создаёт `make k8s-dev-secrets` / CI/CD / Vault.
name: restaurant
image:
  repository: food/restaurant
  tag: dev
port: 8082
replicas: 2
env:
  APP_ENV: dev
  LOG_LEVEL: info
  AUTH_MODE: jwks # личность — только из JWT, проверенного локально по JWKS (ADR-11)
  AUTH_JWKS_URL: http://auth/auth/.well-known/jwks.json
existingSecret: restaurant-secrets # ключи: DATABASE_URL
migrations:
  enabled: true # Job `restaurant-service --migrate-only` (pre-install/pre-upgrade hook)
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 192Mi }
ingress:
  paths: [] # снаружи сервис доступен только через gateway
