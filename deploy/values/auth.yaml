# auth-service (эталон, ADR-2). Секреты создаёт `make k8s-dev-secrets` (в git не хранятся):
#   Secret auth-secrets (DATABASE_URL), Secret auth-jwt (private.pem, public.pem).
name: auth
image:
  repository: food/auth
  tag: dev
port: 8081
replicas: 2
env:
  APP_ENV: dev
  JWT_ISSUER: restaurant-auth-service
  JWT_AUDIENCE: restaurant-api
  JWT_KEY_ID: local-dev-key
  JWT_ACCESS_TTL: 15m
  REFRESH_TOKEN_TTL: 720h
  JWT_PRIVATE_KEY_PATH: /run/keys/private.pem
  JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
  BCRYPT_COST: 12
  SEED_ON_START: "true" # dev-пользователи (демо-пароли); в prod запрещено, сервис не стартует
existingSecret: auth-secrets
secretVolumes:
  - { name: jwt, secretName: auth-jwt, mountPath: /run/keys }
metrics:
  enabled: true
migrations:
  enabled: true # Job `auth-service --migrate-only` (pre-install/pre-upgrade hook)
ingress:
  paths: [] # снаружи — только через gateway; introspect/authorize наружу не публикуются
