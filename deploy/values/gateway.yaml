# api-gateway (S5, ADR-11): единственный публичный вход, кроме вебхуков платёжного шлюза (они идут ingress → payment).
# Секретов нет: ключи проверки JWT берутся из JWKS auth-service. Таблица маршрутов — в образе (routes.json).
name: gateway
image:
  repository: food/gateway
  tag: dev
port: 8080
replicas: 2
env:
  APP_ENV: dev
  LOG_LEVEL: info
  METRICS_ADDR: ":9100"
  UPSTREAM_AUTH_URL: http://auth
  UPSTREAM_RESTAURANT_URL: http://restaurant
  UPSTREAM_MENU_URL: http://menu
  UPSTREAM_ORDERS_URL: http://orders
  UPSTREAM_PAYMENT_URL: http://payment
  AUTH_JWKS_URL: http://auth/auth/.well-known/jwks.json
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  # CIDR ingress-контроллера: от него (и только от него) принимаются X-Forwarded-For/Proto. Уточните командой
  #   kubectl -n ingress-nginx get pods -o wide   (docker-desktop: pod-сеть 10.x)
  TRUSTED_PROXY_CIDRS: 10.0.0.0/8
  RATE_LIMIT_RPS: 50
  RATE_LIMIT_BURST: 100
  AUTH_RATE_PER_MIN: 10
  AUTH_RATE_BURST: 10
probes:
  readiness:
    path: /actuator/health # готов, когда загружен хотя бы один набор ключей JWKS
metrics:
  enabled: true
  port: 9100 # /metrics только на внутреннем порту: через ingress (порт http) недоступен
migrations:
  enabled: false # БД нет
resources:
  requests: { cpu: 50m, memory: 48Mi }
  limits: { memory: 128Mi }
ingress:
  # Всё, что не /webhooks/payments (его забирает ingress payment по более длинному префиксу).
  paths:
    - { path: /, pathType: Prefix }
