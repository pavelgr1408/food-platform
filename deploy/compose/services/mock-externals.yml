# Срез: внешние системы (моки). Включаемые модули — MOCKS=ping,payment,production,courier,push (появляются с S3…S9).
# payment — платёжный шлюз (:9091): вебхуки с HMAC уходят в payment-service.
# production — система производства (:9092, S4): читает orders.state, публикует orders.dish.status и production.lead.time.
services:
  mock-externals:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SRC: tools/mock-externals
        TARGET: ./tools/mock-externals
    environment:
      MOCKS: ${MOCKS:-ping,payment,production}
      MOCK_DELAY: ${MOCK_DELAY:-2s}
      KAFKA_BROKERS: kafka:9092
      MOCK_PAYMENT_WEBHOOK_URL: http://payment:8085/webhooks/payments/gateway
      MOCK_PRODUCTION_QUEUE_DELAY: ${MOCK_PRODUCTION_QUEUE_DELAY:-2s}
      MOCK_PRODUCTION_COOK_TIME: ${MOCK_PRODUCTION_COOK_TIME:-3s}
    ports:
      - "9090-9099:9090-9099"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 64m
