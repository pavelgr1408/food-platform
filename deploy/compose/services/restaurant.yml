services:
  restaurant:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SRC: services/restaurant
        TARGET: ./services/restaurant/cmd/restaurant-service
    environment:
      APP_ENV: dev
      HTTP_PORT: "8082"
      DATABASE_URL: postgres://restaurant:restaurant@postgres:5432/restaurant?sslmode=disable
      SEED_ON_START: "true"
      AUTH_MODE: dev
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
