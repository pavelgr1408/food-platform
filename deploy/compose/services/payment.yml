services:
  payment:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SRC: services/payment
        TARGET: ./services/payment/cmd/payment-service
    environment:
      APP_ENV: dev
      HTTP_PORT: "8085"
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      # dev — личность из X-User-* (срезы без auth); за gateway: AUTH_MODE=jwks make up SLICE="… auth gateway"
      AUTH_MODE: ${AUTH_MODE:-dev}
      AUTH_JWKS_URL: http://auth:8081/auth/.well-known/jwks.json
      GATEWAY_URL: http://mock-externals:9091
      POS_URL: http://mock-externals:9093
      WEBHOOK_WAIT: ${WEBHOOK_WAIT:-10s}
      PENDING_EXPIRY: ${PENDING_EXPIRY:-10m}
      RECONCILE_BACKOFF_MIN: ${RECONCILE_BACKOFF_MIN:-5s}
      # dev-секреты по умолчанию (APP_ENV=dev): GATEWAY_API_KEY / GATEWAY_WEBHOOK_SECRET / POS_API_KEY / POS_WEBHOOK_SECRET
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 128m
