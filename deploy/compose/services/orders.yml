services:
  orders:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SRC: services/orders
        TARGET: ./services/orders/cmd/orders-service
    environment:
      APP_ENV: dev
      HTTP_PORT: "8084"
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      # dev — личность из X-User-* (срезы без auth); за gateway: AUTH_MODE=jwks make up SLICE="… auth gateway"
      AUTH_MODE: ${AUTH_MODE:-dev}
      AUTH_JWKS_URL: http://auth:8081/auth/.well-known/jwks.json
      MENU_URL: http://menu:8083
      RESTAURANT_URL: http://restaurant:8082
      PAYMENT_TIMEOUT: 15m
      LEAD_TIME_TTL: 15m
      # готовый заказ на самовывоз, который не забрали, → not_received (S6); для проверки таймера: NOT_RECEIVED_AFTER=10s JANITOR_INTERVAL=2s
      NOT_RECEIVED_AFTER: ${NOT_RECEIVED_AFTER:-2h}
      JANITOR_INTERVAL: ${JANITOR_INTERVAL:-30s}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 128m
