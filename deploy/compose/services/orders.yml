services:
  orders:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SRC: services/orders
        TARGET: ./services/orders/cmd/orders-service
    environment:
      APP_ENV: dev
      HTTP_PORT: "8084"
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      AUTH_MODE: dev
      MENU_URL: http://menu:8083
      RESTAURANT_URL: http://restaurant:8082
      PAYMENT_TIMEOUT: 15m
      LEAD_TIME_TTL: 15m
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 128m
